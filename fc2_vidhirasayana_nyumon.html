<p style="margin:0 0 .4em;font-weight:bold;font-size:1.1em;"><a href="https://keikataoka1969-boop.github.io/vidhiviveka/vidhirasayana_nyumon.html" target="_blank">ヴィディ・ラサーヤナ入門――「規定の霊薬」を図で読む</a></p>
<p style="margin:0;font-size:.92em;color:#596079;">アッパイヤ・ディークシタ『ヴィディ・ラサーヤナ』の議論を、大学1年生向けに図と表で解説しました。ヴェーダの命令文を三つに分ける「アプールヴァ規定・制限の規定・除外の規定」。その定義に反例をぶつけ、最後に新しい定義を示すまでの道筋を、9枚の図と表でたどります。サンスクリット語の知識は要りません。</p>
